pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'PaperMC'; url = 'https://repo.papermc.io/repository/maven-public/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'craftwire'

// -PapiOnly builds just the public API (plugin and mod developers): no Minecraft, Loom or paperweight needed.
if (providers.gradleProperty('apiOnly').isPresent()) {
    include 'craftwire-api'
    return
}
include 'craftwire-api', 'agent-core', 'bot-core', 'build-core', 'agent-script', 'agent-fabric', 'agent-paper', 'botrunner', 'bedrock-protocol', 'test-fixtures'
include 'botrunner-java'
project(':botrunner-java').projectDir = file('botrunner/java')
include 'compat-check'
project(':compat-check').projectDir = file('tools/compat-check')

// Per supported Minecraft version: the version-specific code of each agent (bundled into its single jar)
// and a Fabric project that runs the client game tests against the built agent jar on that version.
for (String mc : (providers.gradleProperty('mc_versions').get()).split(',')*.trim()) {
    String id = 'v' + mc.replace('.', '_')
    include "fabric-compat-$id", "fabric-gametest-$id", "paper-compat-$id", "botrunner-java-compat-$id"
    project(":fabric-compat-$id").projectDir = file("agent-fabric/compat/$mc")
    project(":fabric-gametest-$id").projectDir = file("agent-fabric/gametest/$mc")
    project(":paper-compat-$id").projectDir = file("agent-paper/compat/$mc")
    project(":botrunner-java-compat-$id").projectDir = file("botrunner/java/compat/$mc")
}
