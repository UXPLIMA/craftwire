plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'craftwire-agent-fabric'
}

repositories {
    mavenCentral()
}

// The common agent compiles against the oldest supported version; what differs lives in compat/<mc>.
def baseProps = rootProject.mcProps(rootProject.baseMc)
def compatProjects = rootProject.mcVersions.collect { ":fabric-compat-${rootProject.mcId(it)}" }

// HUD/scoreboard JSON shared with the Paper bots; both compile it against Mojang-mapped 26.x.
sourceSets.main.java.srcDir rootProject.file('mc-shared/src/main/java')

loom {
    mods {
        "craftwire-agent" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    // client_eval's GraalJS: not in the jar; the agent downloads exactly these jars on first use (GraalRuntime).
    graaljs {
        canBeConsumed = false
        canBeResolved = true
    }
}

evaluationDependsOn(':agent-script')

dependencies {
    graaljs "org.graalvm.polyglot:polyglot:${graal_version}"
    graaljs "org.graalvm.js:js-language:${graal_version}"
    minecraft "com.mojang:minecraft:${baseProps.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${baseProps.fabric_api_version}"

    implementation project(':agent-core')
    include project(':agent-core')
    // ClientEval's tests compile against the engine; the agent itself only loads it at runtime (GraalRuntime).
    testImplementation project(':agent-script')
    // The extension API mods compile against; shipped inside the agent so they find it at runtime.
    include project(':craftwire-api')

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The GraalJS jars client_eval downloads, with their sha256: the same dependency the Paper plugin's libraries name.
def graalManifest = tasks.register('graalManifest') {
    def out = layout.buildDirectory.file('graal/craftwire-graaljs.txt')
    def jars = configurations.graaljs
    def version = graal_version
    inputs.files(jars)
    outputs.file(out)
    doLast {
        def lines = jars.incoming.artifacts.artifacts.collect { a ->
            def id = a.id.componentIdentifier
            def sha = java.security.MessageDigest.getInstance('SHA-256').digest(a.file.bytes).encodeHex().toString()
            "${id.group}:${id.module}:${id.version}:${a.file.name} ${sha}"
        }.sort()
        out.get().asFile.text = "version=${version}\n" + lines.join('\n') + '\n'
    }
}

processResources {
    from(graalManifest)
    // The script engine (agent-script) as a jar inside the agent jar: only GraalRuntime's class loader reads it.
    from(project(':agent-script').tasks.named('jar')) {
        into 'craftwire'
        rename { 'craftwire-script.jar' }
    }
    def versions = rootProject.mcVersions
    def last = versions[-1].tokenize('.')
    def props = [
        version: project.version.toString(),
        // e.g. ">=26.2 <26.4-": every supported release, no newer snapshot.
        minecraft: ">=${versions[0]} <${last[0]}.${(last[1] as int) + 1}-",
        compatMixins: versions.collect { '"craftwire-compat-' + rootProject.mcId(it) + '.mixins.json"' }.join(', '),
    ]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
    // Tells the agent which compat code the jar carries (see compat/Versions).
    from(rootProject.file('gradle.properties')) {
        rename { 'craftwire-compat.properties' }
        filter { line -> line.startsWith('mc_versions=') ? 'versions=' + line.substring('mc_versions='.length()) : null }
    }
}

// The jar carries every version's compat classes and mixin configs.
jar {
    compatProjects.each { path ->
        dependsOn "${path}:classes"
        from { project(path).sourceSets.main.output }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}

ext.compatPrefix = 'fabric-compat-'
apply from: rootProject.file('gradle/compat-check.gradle')
