plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24'
}

base {
    archivesName = 'craftwire-paper'
}

// The common plugin compiles against the oldest supported version; what differs lives in compat/<mc>.
def baseProps = rootProject.mcProps(rootProject.baseMc)
def compatProjects = rootProject.mcVersions.collect { ":paper-compat-${rootProject.mcId(it)}" }
// Integration tests run the built jar on one version: -Pmc=26.3 (default: the oldest).
def itProps = rootProject.mcProps(project.findProperty('mc') ?: rootProject.baseMc)

evaluationDependsOn(':agent-core')
evaluationDependsOn(':craftwire-api')
evaluationDependsOn(':test-fixtures')

repositories {
    maven { name = 'PaperMC'; url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
}

sourceSets {
    // HUD/scoreboard JSON shared with the Fabric agent; both compile it against Mojang-mapped 26.x.
    main.java.srcDir rootProject.file('mc-shared/src/main/java')
    integrationTest {}
}

dependencies {
    // Paper API plus Mojang-mapped server internals; only the bot package touches the internals.
    paperweight.paperDevBundle(baseProps.paper_dev_bundle)
    compileOnly "org.apache.logging.log4j:log4j-core:${log4j_version}"
    // GraalJS comes from Paper's library loader at runtime (plugin.yml `libraries`), never from this jar.
    compileOnly "org.graalvm.polyglot:polyglot:${graal_version}"
    implementation project(':agent-core')

    testImplementation "org.apache.logging.log4j:log4j-core:${log4j_version}"
    testImplementation "org.graalvm.polyglot:polyglot:${graal_version}"
    testImplementation "org.graalvm.js:js-language:${graal_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation platform('org.junit:junit-bom:5.13.4')
    integrationTestImplementation 'org.junit.jupiter:junit-jupiter'
    integrationTestImplementation 'org.junit.platform:junit-platform-launcher'
    integrationTestImplementation 'com.google.code.gson:gson:2.13.2'
    integrationTestImplementation 'org.java-websocket:Java-WebSocket:1.6.0'
}

jar {
    // agent-core is bundled as plain classes; Gson and log4j are provided by Paper.
    dependsOn ':agent-core:classes', ':craftwire-api:classes'
    from project(':agent-core').sourceSets.main.output
    // The extension API: plugins compile against it and use these classes (softdepend: [Craftwire]).
    from project(':craftwire-api').sourceSets.main.output
    // Every supported version's server code; ServerCompat picks one at runtime.
    compatProjects.each { path ->
        dependsOn "${path}:classes"
        from { project(path).sourceSets.main.output }
    }
}

processResources {
    def props = [version: project.version.toString(), graalVersion: graal_version]
    inputs.properties props
    filesMatching('plugin.yml') { expand props }
    // Tells the plugin which compat code the jar carries (see compat/ServerCompat).
    from(rootProject.file('gradle.properties')) {
        rename { 'craftwire-compat.properties' }
        filter { line -> line.startsWith('mc_versions=') ? 'versions=' + line.substring('mc_versions='.length()) : null }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs the plugin inside a real Paper server.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn tasks.named('jar'), ':test-fixtures:jar'
    def pluginJar = tasks.named('jar').flatMap { it.archiveFile }
    def fixtureJar = project(':test-fixtures').tasks.named('jar').flatMap { it.archiveFile }
    def itDir = layout.buildDirectory.dir("it/${itProps.minecraft_version}")
    inputs.files(pluginJar, fixtureJar)
    systemProperty 'craftwire.mcVersion', itProps.minecraft_version
    systemProperty 'craftwire.paperBuild', itProps.paper_build
    systemProperty 'craftwire.paperSha256', itProps.paper_sha256
    systemProperty 'craftwire.version', project.version.toString()
    doFirst {
        systemProperty 'craftwire.pluginJars', [pluginJar.get().asFile, fixtureJar.get().asFile]*.absolutePath.join(File.pathSeparator)
        systemProperty 'craftwire.itDir', itDir.get().asFile.absolutePath
    }
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed'
        exceptionFormat 'full'
    }
}

ext.compatPrefix = 'paper-compat-'
apply from: rootProject.file('gradle/compat-check.gradle')
