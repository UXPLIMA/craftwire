plugins {
    id 'java'
}

base {
    archivesName = 'craftwire-test-fixtures'
}

repositories {
    maven { name = 'PaperMC'; url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    // Paper API only, so the fixture plugin runs on every supported version.
    compileOnly "io.papermc.paper:paper-api:${rootProject.mcProps(rootProject.baseMc).paper_dev_bundle}"
}

processResources {
    def props = [version: project.version.toString()]
    inputs.properties props
    filesMatching('plugin.yml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
