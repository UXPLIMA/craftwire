name: CI
on:
  push:
  pull_request:

jobs:
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :agent-core:test :agent-fabric:test :agent-fabric:build :agent-paper:test :agent-paper:build :test-fixtures:build

  client-gametest:
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :agent-fabric:runClientGameTest
      # Again with Sodium, which culls terrain on its own (camera override shots must still show the subject).
      - run: |
          curl -fsSL -o /tmp/sodium.jar "https://cdn.modrinth.com/data/AANobbMI/versions/xJZxADzI/sodium-fabric-0.9.2%2Bmc26.2.jar"
          echo "16a5e91db49750f8c046ecca3b8f2af5a28ea6f9b6581b42f123ca8fda20864f  /tmp/sodium.jar" | sha256sum -c -
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :agent-fabric:runClientGameTest -PextraClientMods=/tmp/sodium.jar
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            agent-fabric/build/run/**/logs/
            agent-fabric/build/run/**/craftwire-camera-shots/

  paper-it:
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :agent-paper:integrationTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paper-it-logs
          path: agent-paper/build/it/server/logs/

  dev-loop-e2e:
    runs-on: ubuntu-latest
    needs: [java, hub]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: ./gradlew :agent-paper:build :test-fixtures:build
      - run: npm ci
        working-directory: hub
      - run: npm run test:e2e
        working-directory: hub
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-loop-e2e-logs
          path: hub/.e2e/server/logs/
