name: CI
on:
  push:
  pull_request:

jobs:
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Unit tests, the jars, and checkCompat: every class/method/field the agent jars use exists in every
  # supported Minecraft version (tools/compat-check).
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  # The same agent jar, on every supported version (versions/<mc>.properties).
  client-gametest:
    runs-on: ubuntu-latest
    needs: java
    # A game that cannot open its window waits forever instead of exiting.
    timeout-minutes: 30
    # From 26.3 the game (SDL3) asks for an sRGB-capable GLX visual, which Xvfb does not have; EGL (libegl1, libegl-mesa0) works.
    env:
      SDL_VIDEO_FORCE_EGL: '1'
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # GraalJS that client_eval downloads in the game tests (~60 MB; the agent checks every jar's sha256 anyway).
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/craftwire-test-home/lib
          key: graaljs-${{ hashFiles('gradle.properties') }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libegl-mesa0
      - id: v
        run: |
          echo "id=v$(echo '${{ matrix.mc }}' | tr . _)" >> "$GITHUB_OUTPUT"
          grep -E '^sodium_(url|sha256)=' versions/${{ matrix.mc }}.properties | sed 's/^sodium_//' >> "$GITHUB_OUTPUT"
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric-gametest-${{ steps.v.outputs.id }}:runClientGameTest
      # Again with Sodium, which culls terrain on its own (camera override shots must still show the subject).
      - run: |
          curl -fsSL -o /tmp/sodium.jar "${{ steps.v.outputs.url }}"
          echo "${{ steps.v.outputs.sha256 }}  /tmp/sodium.jar" | sha256sum -c -
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric-gametest-${{ steps.v.outputs.id }}:runClientGameTest -PextraClientMods=/tmp/sodium.jar
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ matrix.mc }}
          path: |
            agent-fabric/gametest/${{ matrix.mc }}/build/run/**/logs/
            agent-fabric/gametest/${{ matrix.mc }}/build/run/**/craftwire-camera-shots/

  paper-it:
    runs-on: ubuntu-latest
    needs: java
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :agent-paper:integrationTest -Pmc=${{ matrix.mc }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paper-it-logs-${{ matrix.mc }}
          path: agent-paper/build/it/${{ matrix.mc }}/server/logs/

  dev-loop-e2e:
    runs-on: ubuntu-latest
    needs: [java, hub]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.2', '26.3']
    env:
      CRAFTWIRE_E2E_MC: ${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: ./gradlew :agent-paper:jar :agent-fabric:jar :test-fixtures:jar
      # client_process runs its client under xvfb-run on a machine without a display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libegl-mesa0
      - uses: actions/cache@v4
        with:
          path: hub/.e2e/client-cache
          key: client-cache-${{ matrix.mc }}-${{ hashFiles(format('versions/{0}.properties', matrix.mc)) }}
      - run: npm ci
        working-directory: hub
      - run: npm run test:e2e
        working-directory: hub
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-loop-e2e-logs-${{ matrix.mc }}
          path: |
            hub/.e2e/server/logs/
            hub/.e2e/client-server/logs/
            hub/.e2e/client-cache/instances/*/logs/
