name: CI
on:
  push:
  pull_request:

jobs:
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :agent-core:test :agent-fabric:test :agent-fabric:build :agent-paper:test :agent-paper:build :test-fixtures:build

  client-gametest:
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :agent-fabric:runClientGameTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: agent-fabric/build/run/**/logs/

  paper-it:
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :agent-paper:integrationTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paper-it-logs
          path: agent-paper/build/it/server/logs/
