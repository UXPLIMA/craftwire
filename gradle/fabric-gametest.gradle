// Client game tests for one Minecraft version (agent-fabric/gametest/<mc>), run against the built agent jar:
// the jar users get is what is tested on every supported version. Sources are shared in agent-fabric/src/gametest.
def mc = projectDir.name
def props = rootProject.mcProps(mc)
def agentJar = project(':agent-fabric').tasks.named('jar').flatMap { it.archiveFile }

repositories { mavenCentral() }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "craftwire-agent-gametest"
        enableClientGameTests = true
        eula = true
    }
}

sourceSets.gametest.java.srcDirs = [rootProject.file('agent-fabric/src/gametest/java')]
sourceSets.gametest.resources.srcDirs = [rootProject.file('agent-fabric/src/gametest/resources')]

dependencies {
    minecraft "com.mojang:minecraft:${props.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${props.fabric_api_version}"
    implementation files(agentJar)
    gametestCompileOnly project(':agent-core')
    gametestCompileOnly project(':craftwire-api')

    // Optional: more mods in the test client, e.g. -PextraClientMods=C:/mods/sodium.jar (';'-separated).
    if (project.hasProperty('extraClientMods')) {
        runtimeOnly files(project.property('extraClientMods').toString().split(';'))
    }
}

// Game tests run with the window hidden, like clients started by client_process, and with a Craftwire home of
// their own: never the user's hub.json, and client_eval's GraalJS download is kept between runs.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    dependsOn ':agent-fabric:jar'
    jvmArgs '-Dcraftwire.hidden=true'
    environment 'CRAFTWIRE_HOME', new File(gradle.gradleUserHomeDir, 'craftwire-test-home').absolutePath
}

tasks.withType(JavaCompile).configureEach {
    dependsOn ':agent-fabric:jar'
    options.release = 25
    options.encoding = 'UTF-8'
}
