# JitPack builds only the extension API: com.github.uxplima.craftwire:craftwire-api:<tag>
jdk:
  - openjdk21
install:
  # Not ./gradlew: JitPack's Java 21 launcher cannot open the Gradle 9 wrapper jar with -jar ("An unexpected error
  # occurred while trying to open file"); loading it from the classpath works.
  - java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -PapiOnly :craftwire-api:publishToMavenLocal --console=plain
