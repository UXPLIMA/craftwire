# JitPack builds only the extension API: com.github.uxplima:craftwire:<tag>
jdk:
  - openjdk21
install:
  # Checks the wrapper jar. On JitPack this also has to come first: Java fails to open the freshly checked-out
  # wrapper jar until something has read it. Update the sha256 when the Gradle wrapper is updated.
  - echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
  - ./gradlew -PapiOnly :craftwire-api:publishToMavenLocal --console=plain
